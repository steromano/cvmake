# CV Generation Preferences

# Default CV style to use if not specified
default_template: modern

# Page length preference
max_pages: 2

# Include/exclude sections by default
default_sections:
  summary: true
  experience: true
  education: true
  skills: true
  projects: true
  publications: false
  certifications: false
  languages: false
  interests: false

# Date formats
date_format: "MMM YYYY"  # e.g., "Jan 2023"

# Skill grouping preferences
skill_categories:
  - Technical Skills
  - Tools & Technologies
  - Soft Skills
